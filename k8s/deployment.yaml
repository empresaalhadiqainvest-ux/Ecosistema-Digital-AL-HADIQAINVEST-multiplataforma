apiVersion: apps/v1
kind: Deployment
metadata:
  name: alhadiqa-invest-web
  labels:
    app: alhadiqa-invest-web
    tier: headless-core
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: alhadiqa-invest-web
  template:
    metadata:
      labels:
        app: alhadiqa-invest-web
        track: stable
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: alhadiqa-core
          image: ghcr.io/empresaalhadiqainvest-ux/alhadiqa-invest-core:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: alhadiqa-vault-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '768Mi'
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: alhadiqa-invest-svc
spec:
  type: ClusterIP
  selector:
    app: alhadiqa-invest-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
